- number: "03"
  title: "No EU office? Article 50 still applies from 2 August"
  date: 2026-08-18
  url: "https://buttondown.com/the_desk/archive/no-eu-office-article-50-still-applies-from-2/"
  platform: Buttondown
  summary: >-
    Article 50 of the EU AI Act became applicable on 2 August 2026, and the Commission's
    own guidance confirms it reaches providers outside the EU whenever their system's
    output is used inside it — no EU entity required. Plus why compliance with India's
    SGI labelling rules, live since 20 February 2026, is not compliance with Article 50,
    and the transitional carve-out that closes on 2 December 2026.

- number: "02"
  title: "DPDP Alert: the Consent-Manager deadline is real"
  date: 2026-08-05
  url: "https://buttondown.com/the_desk/archive/dpdp-alert-the-consent-manager-deadline-is-real/"
  platform: Buttondown
  summary: >-
    The Consent Manager registration regime goes live on 13 November 2026, and most
    data fiduciaries have not started. Plus the RBI's draft data-governance guidance
    (comments closed 17 August 2026) and where the Supreme Court's draft AI-in-Courts
    regulations actually stand.

- number: "01"
  title: "DPDP: the 2027 compliance clock is now running"
  date: 2026-07-18
  url: "https://wolfgangrush.substack.com/p/dpdp-the-2027-compliance-clock-is"
  platform: Substack
  summary: >-
    The full DPDP timeline in one place — the 13 November 2025 Rules notification,
    Consent Managers from 13 November 2026, core obligations from 13 May 2027, who
    counts as a Significant Data Fiduciary, and how section 3(1)(b) reaches companies
    with no Indian office. Plus EU AI Act Article 50 and Connecticut's CTDPA.
