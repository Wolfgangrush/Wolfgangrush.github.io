- number: "08"
  title: "What \"delete\" actually deletes."
  date: 2026-09-20
  url: "https://buttondown.com/the_desk/archive/what-delete-actually-deletes/"
  platform: Buttondown
  summary: >-
    THE PRIMER Part 3 — you deleted the conversation, and the product still knows what was
    in it. The thing that remembers is a third record: a note the product wrote about you
    while you were talking, with its own delete button that deleting the chat does not
    press. What each control actually reaches at ChatGPT, Claude and Gemini, read
    first-hand on the day of publication — including the page one vendor rewrote overnight,
    and why a screenshot with a date on it beats a link. Why "delete my chat" and "delete
    my data" are different requests, how Europe, California and India each choose a
    different word for what erasure erases, and the one-year floor Rule 8(3) puts under
    deletion in India from May 2027.

- number: "07"
  title: "Where your draft actually goes."
  date: 2026-09-13
  url: "https://buttondown.com/the_desk/archive/where-your-draft-actually-goes/"
  platform: Buttondown
  summary: >-
    THE PRIMER Part 2 — you paste three paragraphs of your own draft into a chat box to
    tidy the language. This is what happens to them. Whether your text is used to train
    the model depends entirely on which account you were logged into, and both major
    vendors say so in their own words. Two holes in the opt-out that almost nobody knows
    about, including the thumbs-down button. Why a personal plan is not a processor
    arrangement at all. And what section 11(1)(b) of the DPDP Act lets a person demand
    from you about every company that has held their data.

- number: "06"
  title: "It predicts the next word. That is the whole machine."
  date: 2026-09-07
  url: "https://buttondown.com/the_desk/archive/it-predicts-the-next-word-that-is-the-whole/"
  platform: Buttondown
  summary: >-
    THE PRIMER starts here — a weekly strand that explains how these systems actually
    work, from zero, for lawyers who will have to advise on them. Part 1: what a language
    model is, why anyone built a next-word guesser in the first place, and why invented
    citations are a structural property rather than a bug. Plus a word-by-word audit of
    the DPDP Act showing the entire GDPR Article 22 vocabulary is absent from it, and the
    IT Amendment Rules 2026 that have been binding AI law in force since 20 February.

- number: "05"
  title: "No country is restricted. Your data still cannot leave."
  date: 2026-08-31
  url: "https://buttondown.com/the_desk/archive/no-country-is-restricted-your-data-still-cannot/"
  platform: Buttondown
  summary: >-
    India did not build a transfer mechanism, and that is the point. Section 16 uses a
    blacklist — transfer is permitted unless the Central Government restricts a
    destination — rather than the GDPR's whitelist and adequacy model, and no country has
    been notified. What actually binds an Indian company's data exports today, ranked.

- number: "04"
  title: "81 days to register. Who exactly receives the application?"
  date: 2026-08-24
  url: "https://buttondown.com/the_desk/archive/81-days-to-register-who-exactly-receives-the/"
  platform: Buttondown
  summary: >-
    Rule 4 of the DPDP Rules makes Consent-Manager registration the Data Protection
    Board's exclusive function, and the window opens on 13 November 2026 — but as at
    1 August 2026 the Board had no appointed Chairperson and no appointed Members.
    Plus the RBI's draft data-governance guidance, which closed for comment on
    17 August with no final instrument issued, and the EU AI Act Article 50 grace
    period that expires in 100 days.

- number: "03"
  title: "No EU office? Article 50 still applies from 2 August"
  date: 2026-08-18
  url: "https://buttondown.com/the_desk/archive/no-eu-office-article-50-still-applies-from-2/"
  platform: Buttondown
  summary: >-
    Article 50 of the EU AI Act became applicable on 2 August 2026, and the Commission's
    own guidance confirms it reaches providers outside the EU whenever their system's
    output is used inside it — no EU entity required. Plus why compliance with India's
    SGI labelling rules, live since 20 February 2026, is not compliance with Article 50,
    and the transitional carve-out that closes on 2 December 2026.

- number: "02"
  title: "DPDP Alert: the Consent-Manager deadline is real"
  date: 2026-08-05
  url: "https://buttondown.com/the_desk/archive/dpdp-alert-the-consent-manager-deadline-is-real/"
  platform: Buttondown
  summary: >-
    The Consent Manager registration regime goes live on 13 November 2026, and most
    data fiduciaries have not started. Plus the RBI's draft data-governance guidance
    (comments closed 17 August 2026) and where the Supreme Court's draft AI-in-Courts
    regulations actually stand.

- number: "01"
  title: "DPDP: the 2027 compliance clock is now running"
  date: 2026-07-18
  url: "https://wolfgangrush.substack.com/p/dpdp-the-2027-compliance-clock-is"
  platform: Substack
  summary: >-
    The full DPDP timeline in one place — the 13 November 2025 Rules notification,
    Consent Managers from 13 November 2026, core obligations from 13 May 2027, who
    counts as a Significant Data Fiduciary, and how section 3(1)(b) reaches companies
    with no Indian office. Plus EU AI Act Article 50 and Connecticut's CTDPA.
