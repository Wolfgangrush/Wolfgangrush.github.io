# The eight practice brains.
#
# Every claim in this file is taken from the corresponding repository's own README
# and conduct-mapping documentation. If a repository changes its position, change it
# here too — this file is what the website tells the public.
#
# `local_covers`  — what running the model on your own machine WOULD satisfy.
#                   ✅ 2026-08-25: THE LOCAL TIER IS WIRED IN ALL EIGHT EDITIONS.
#                   `connect-local` ships in every one and brain/llm.py honours it with
#                   no cloud fallback. Verified by audit-localtier.sh against each repo's
#                   own source. These are delivered guarantees when local mode is on.
# `cloud_owes`    — what remains YOUR obligation if you choose the cloud tier.
#                   Pseudonymisation is a technical safeguard. It is not a discharge.

- slug: india
  name: India
  who: "Advocates enrolled with a State Bar Council"
  repo: "https://github.com/Wolfgangrush/ai-brain-india"
  price: "₹0 forever"
  regulator: "Bar Council of India"
  local_covers: >-
    Bar Council Rule 17 confidentiality is supported by absence of transmission — nothing
    is sent, so no transfer question arises. Legal-professional privilege under section 132
    of the Bharatiya Sakshya Adhiniyam 2023 is untouched.
  cloud_owes: >-
    Transmission engages the DPDP Act. Use for privileged work should rest on an engagement
    letter that discloses AI use and on your own audit basis.
  note: ""

- slug: uk
  name: United Kingdom
  who: "Solicitors (SRA), barristers (BSB), advocates (Faculty of Advocates), CILEx practitioners, in-house counsel"
  repo: "https://github.com/Wolfgangrush/ai-brain-uk"
  price: "£0 forever"
  regulator: "SRA · BSB · Faculty of Advocates · CILEx"
  local_covers: >-
    Implements the Bar Standards Board's Guidance on the use of Artificial Intelligence and
    Other Technologies (effective 18 May 2026) — the risk matrix, AI audit logs under rC87.2,
    outsourcing classification under rC86, the rC19 transparency gate and rC20 human-in-the-loop.
  cloud_owes: >-
    The same conduct duties, plus the transmission itself. The Hamid-jurisdiction line
    (Ayinde · Al-Haroun [2025] EWHC 1383 Admin; Munir [2026] UKUT 81 IAC; Oakley [2024]
    UKFTT 315 GRC) is what happens when output is not checked.
  note: ""

- slug: eu
  name: European Union
  who: "Avocat · Anwalt · advocaat · abogado · avvocato · advokát · δικηγόρος · adwokat and the rest of the EU bar"
  repo: "https://github.com/Wolfgangrush/ai-brain-eu"
  price: "€0 forever"
  regulator: "National bars · GDPR · the AI Act"
  local_covers: >-
