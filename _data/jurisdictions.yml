- slug: australia
  name: Australia
  who: "Solo solicitors and barristers, LPUL era"
  repo: "https://github.com/Wolfgangrush/ai-brain-australia"
  price: "AU$0 forever"
  regulator: "State and territory legal services commissioners · OAIC · AUSTRAC"
  local_covers: >-
    Australian Privacy Principle 8, LPUL Rule 9 confidentiality and Tranche 2 AML
    obligations supported at the architecture layer.
  cloud_owes: >-
    Standard APP 8 cross-border disclosure obligations remain yours.
  note: >-
    ⛔ Hard exception — section 77 My Health Records data. The prohibition attaches to offshore
    handling itself, not to what is transmitted, so gateway pseudonymisation does not cure it.
    The local tier would cure it, and the local tier is NOT WIRED YET. That means there is
    currently NO configuration of this tool that is safe for My Health Records matters.
    Do not use it for them until the local milestone ships.
